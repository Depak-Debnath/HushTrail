<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HushTrail — Travel like a local, not a tourist</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <meta name="description" content="HushTrail — discover hidden gems, local food, and authentic experiences. Travel like a local, not a tourist." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
  </head>
  <body>
    <header class="hero">
      <h1>🌍 HushTrail</h1>
      <p class="tagline">Travel like a local, not a tourist.</p>
    </header>

    <main>
      <section class="form-card">
        <h2>Plan Your Trip</h2>
        <form id="tripForm">
          <label for="destination">Destination</label>
          <input
            type="text"
            id="destination"
            placeholder="e.g. Jaipur, India"
            required
          />

          <label for="interests">Interests</label>
          <input
            type="text"
            id="interests"
            placeholder="e.g. food, photography, history"
            required
          />

          <label for="budget">Budget (in ₹ or $)</label>
          <input type="text" id="budget" placeholder="e.g. 15000" required />

          <label for="travelers">Number of Travelers</label>
          <input
            type="number"
            id="travelers"
            min="1"
            placeholder="e.g. 2"
            required
          />

          <label for="duration">Trip Duration (days)</label>
          <input
            type="number"
            id="duration"
            min="1"
            placeholder="e.g. 3"
            required
          />

          <button type="submit">✨ Discover Hidden Gems</button>
        </form>
      </section>

      <section id="loading" class="hidden" aria-live="polite">
        <p>🔍 Finding hidden gems for you...</p>
      </section>

      <section id="results" class="hidden"></section>

      <section id="assistant" class="hidden">
        <h3>🤖 Ask about your trip</h3>
        <div id="chatMessages"></div>
        <form id="assistantForm">
          <input
            type="text"
            id="assistantInput"
            placeholder="e.g. Is the food spot near Gem 1 good for vegetarians?"
            required
          />
          <button type="submit">Ask</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Made with 🤍 for travelers who like getting lost.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
